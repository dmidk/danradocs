name: Jupyter Book and GitHub Pages

on:
    push:
      tags: ["*"] # deploy on any tag
    pull_request: # build on any pull request

permissions:
  contents: write

jobs:
    build-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                fetch-depth: 0

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                    python-version: '3.10'

            - name: Install dependencies
              uses: astral-sh/setup-uv@v2
              with:
                    enable-cache: true

            - name: Build Jupyter Book
              run: uv run jupyter-book build danra-book/

            - name: Check that the Jupyter Book HTML was generated
              run: |
                    if [ ! -f danra-book/_build/html/index.html ]; then
                      echo "::error::Jupyter Book build did not produce danra-book/_build/html/index.html"
                      exit 1
                    fi

            - name: Upload Jupyter Book as artifact (for debugging)
              uses: actions/upload-artifact@v4
              with:
                    name: jupyter-book
                    path: danra-book/_build/html
                    if-no-files-found: error

            - name: Deploy to GitHub Pages
              if: startsWith(github.ref, 'refs/tags/')
              run: |
                    uv run ghp-import -n -p -f danra-book/_build/html
