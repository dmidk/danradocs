name: Jupyter Book and GitHub Pages

on:
    push:
      tags: ["*"] # deploy on any tag
    pull_request: # build on any pull request

permissions:
  contents: write

jobs:
    build-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                fetch-depth: 0

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                    python-version: '3.10'

            - name: Install dependencies
              uses: astral-sh/setup-uv@v2
              with:
                    enable-cache: true

            - name: Build Jupyter Book
              run: uv run jupyter-book build danra-book/

            - name: Check that the Jupyter Book HTML was generated
              run: |
                    if [ ! -f danra-book/_build/html/index.html ]; then
                      echo "::error::Jupyter Book build did not produce danra-book/_build/html/index.html"
                      exit 1
                    fi

            - name: Upload Jupyter Book as artifact (for debugging)
              uses: actions/upload-artifact@v4
              with:
                    name: jupyter-book
                    path: danra-book/_build/html
                    if-no-files-found: error

            - name: Check out the published site
              if: startsWith(github.ref, 'refs/tags/')
              uses: actions/checkout@v4
              with:
                    ref: gh-pages
                    path: gh-pages

            # Each release is published to its own folder, named after the DANRA data
            # version (data_version in danra-book/_config.yml). Other versions on the
            # site are kept. Release candidate tags (containing "rc") only update their
            # folder; other releases also point the site root to it.
            - name: Deploy to GitHub Pages
              if: startsWith(github.ref, 'refs/tags/')
              run: |
                    version=$(sed -n 's/^data_version: *//p' danra-book/_config.yml)
                    if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                      echo "::error::data_version in danra-book/_config.yml must look like v1.2.3, got '$version'"
                      exit 1
                    fi
                    rm -rf "gh-pages/$version"
                    cp -r danra-book/_build/html "gh-pages/$version"
                    if [[ "$GITHUB_REF_NAME" != *rc* ]]; then
                      sed "s/__DATA_VERSION__/$version/g" .github/pages/index.html > gh-pages/index.html
                    fi
                    cp .github/pages/404.html gh-pages/404.html
                    touch gh-pages/.nojekyll

                    cd gh-pages
                    git config user.name "github-actions[bot]"
                    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                    git add -A
                    if git diff --cached --quiet; then
                      echo "Nothing changed on the published site"
                      exit 0
                    fi
                    git commit -m "Publish $version docs from $GITHUB_REF_NAME"
                    git push
