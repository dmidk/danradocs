metadata:
  version: 1

sources:
  single_levels_analysis:
    description: DANRA single level parameters (surface and near-surface data), analysis, every 3 hours
    driver: zarr
    args:
      urlpath: s3://dmi-danra-061/single_levels_analysis.zarr
      storage_options:
        anon: true
      consolidated: true

  single_levels_forecast_PT3H:
    description: DANRA single level parameters (surface and near-surface data), forecasts started every 3 hours, lead times 1-3 hours
    driver: zarr
    args:
      urlpath: s3://dmi-danra-061/single_levels_forecast_PT3H.zarr
      storage_options:
        anon: true
      consolidated: true

  single_levels_forecast_PT18H:
