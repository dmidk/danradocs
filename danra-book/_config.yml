# Book settings
# Learn more at https://jupyterbook.org/customize/config.html

title: DANRA-book
author: DMI NWP Team
logo: logo.png
copyright: '2025'

# Version of the DANRA dataset these docs describe. A release is published to
# https://dmidk.github.io/danradocs/<data_version>/ (see .github/workflows/sphinx.yml)
data_version: &data_version v0.6.1

# Force re-execution of notebooks on each build.
# See https://jupyterbook.org/content/execute.html
execute:
  exclude_patterns:
    - 'notebooks/**.ipynb'  # exclude all notebooks in the notebooks folder

# Generated by scripts/parameter_list.py and included in docs/data-details.md,
# so it should not be built as a page of its own
exclude_patterns:
  - docs/parameters.md

# Define the name of the latex output file for PDF builds
latex:
  latex_documents:
    targetname: book.tex

# Add a bibtex file so that we can create citations
bibtex_bibfiles:
  - references.bib

# Information about where the book exists on the web
repository:
  url: https://github.com/dmidk/danradocs # Online location of your book
  path_to_book: danra-book  # Optional path to your book, relative to the repository root
  branch: main  # Which branch of the repository should be used when creating links (optional)

# Add GitHub buttons to your book
# See https://jupyterbook.org/customize/config.html#add-a-link-to-your-repository
html:
  use_issues_button: true
  use_repository_button: true

# Version dropdown in the sidebar, listing the versions in versions.json at the
# site root (maintained by .github/workflows/sphinx.yml)
sphinx:
  recursive_update: true
  config:
    html_theme_options:
      switcher:
        json_url: /danradocs/versions.json
        version_match: *data_version
      # versions.json only exists on the published site, so don't fetch it at build time
      check_switcher: false
    html_sidebars:
      "**":
        - navbar-logo.html
        - version-switcher
        - icon-links.html
        - search-button-field.html
        - sbt-sidebar-nav.html
